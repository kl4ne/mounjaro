name: Deploy GLP-1 Companion ZIP

on:
  push:
    branches:
      - main
    paths:
      - "GLP1_Companion_Release.zip"

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Prepare site folder
        run: |
          rm -rf _site
          mkdir _site

      - name: Extract release ZIP
        run: |
          unzip -q GLP1_Companion_Release.zip -d _site

      - name: Verify required files
        run: |
          test -f _site/index.html || {
            echo "ERROR: index.html was not found in the root of the ZIP."
            exit 1
          }

          test -f _site/sw.js || {
            echo "ERROR: sw.js was not found."
            exit 1
          }

          test -f _site/manifest.webmanifest || {
            echo "ERROR: manifest.webmanifest was not found."
            exit 1
          }

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

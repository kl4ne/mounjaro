name: Build and deploy GLP-1 Companion

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Reject legacy root structure
        shell: bash
        run: |
          set -euo pipefail
          legacy_paths=(assets icons runtime sw.js manifest.webmanifest)
          found=0
          for path in "${legacy_paths[@]}"; do
            if [ -e "$path" ]; then
              echo "::error::Legacy root path detected: $path"
              found=1
            fi
          done
          if [ -e ".github/workflows/deploy-pages.yml" ]; then
            echo "::error::Legacy workflow detected: .github/workflows/deploy-pages.yml"
            found=1
          fi
          if [ "$found" -ne 0 ]; then
            echo "Repository is not clean. Remove the legacy paths before deployment."
            exit 1
          fi
          echo "Clean Vite repository structure verified."

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'

      - name: Show Node and npm versions
        run: |
          node --version
          npm --version

      - name: Verify v5.3.0 source before install
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-source.mjs
          test -f src/runtime/11-ai-history-cache.ts
          test -f scripts/build-runtime.mjs
          test -f scripts/verify-generated.mjs
          grep -Fq 'src/runtime/**/*.ts' tsconfig.runtime.emit.json
          grep -Fq 'node scripts/build-runtime.mjs' package.json
          grep -Fq '11-ai-history-cache.js' scripts/verify-dist.mjs
          echo "v5.3.0 source/build configuration verified before install."

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate and verify all 11 runtime modules
        run: |
          npm run build:generated
          test -f public/runtime/11-ai-history-cache.js
          echo "OK: public/runtime/11-ai-history-cache.js generated before Vite build"

      - name: Build and validate v5.3.0 with Vite
        run: npm run build

      - name: Final v5.3.0 deployment guard
        shell: bash
        run: |
          set -euo pipefail

          require_file() {
            if [ ! -f "$1" ]; then
              echo "::error::Missing production file: $1"
              exit 1
            fi
            echo "OK: $1"
          }

          if [ ! -d dist ]; then
            echo "::error::Missing dist directory"
            exit 1
          fi

          require_file dist/index.html
          require_file dist/sw.js
          require_file dist/manifest.webmanifest
          require_file dist/runtime/09-ai-intelligence.js
          require_file dist/runtime/10-ai-phase2.js
          require_file dist/runtime/11-ai-history-cache.js

          if ! grep -q 'v5.3.0' dist/index.html; then
            echo "::error::dist/index.html does not identify v5.3.0"
            exit 1
          fi
          echo "OK: index.html identifies v5.3.0"

          if ! grep -q 'v5.3.0-pwa' dist/sw.js; then
            echo "::error::dist/sw.js does not contain BUILD_ID v5.3.0-pwa"
            grep -n 'BUILD_ID' dist/sw.js || true
            exit 1
          fi
          echo "OK: service worker is v5.3.0-pwa"

          node <<'NODE'
          const fs = require('fs');
          const m = JSON.parse(fs.readFileSync('dist/manifest.webmanifest', 'utf8'));
          if (m.version !== '5.3.0') {
            console.error(`::error::Unexpected manifest version: ${m.version}`);
            process.exit(1);
          }
          console.log(`OK: manifest version ${m.version}`);
          NODE

          echo "GLP-1 Companion v5.3.0 AI History & Smart Cache production build verified."
          find dist -maxdepth 2 -type f | sort

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Vite dist
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy Vite build to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

name: Build and deploy GLP-1 Companion

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'

      - name: Show Node and npm versions
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript strict validation
        run: npm run typecheck

      - name: Build with Vite
        run: npm run build

      - name: Verify Vite dist
        run: |
          test -d dist
          test -f dist/index.html
          echo "Vite dist verified successfully"
          find dist -maxdepth 2 -type f | sort

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Vite dist
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

      - name: Save generated package-lock
        uses: actions/upload-artifact@v4
        with:
          name: npm-package-lock-v5.1.0
          path: package-lock.json
          if-no-files-found: warn
          retention-days: 30

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy Vite build to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

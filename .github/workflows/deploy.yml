name: Build and deploy GLP-1 Companion

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false

      - name: Install pinned dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript strict validation
        run: npm run typecheck

      - name: Build with Vite 8
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Vite dist
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

      - name: Preserve generated lockfile for first-build reproducibility
        uses: actions/upload-artifact@v4
        with:
          name: npm-package-lock-v5.0.2
          path: package-lock.json
          if-no-files-found: error
          retention-days: 30

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy Vite build to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

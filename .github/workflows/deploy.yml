name: Build and deploy GLP-1 Companion

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'

      - name: Show Node and npm versions
        run: |
          node --version
          npm --version

      - name: Show deployment source
        run: |
          echo "Commit being deployed:"
          git rev-parse HEAD

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript strict validation
        run: npm run typecheck

      - name: Build with Vite
        run: npm run build

      - name: Verify Vite dist
        run: |
          test -d dist
          test -f dist/index.html
          test -f dist/sw.js
          test -f dist/manifest.webmanifest
          test -f dist/runtime/09-ai-intelligence.js

          echo "Core v5.1.0 production files exist."

      - name: Verify GLP-1 Companion v5.1.0
        run: |
          echo "Checking v5.1.0 deployment..."

          if ! grep -q "v5.1.0-pwa" dist/sw.js; then
            echo "ERROR: dist/sw.js is not v5.1.0-pwa"
            cat dist/sw.js | head -30
            exit 1
          fi

          if ! grep -q "09-ai-intelligence.js" dist/sw.js; then
            echo "ERROR: sw.js does not precache AI intelligence runtime."
            exit 1
          fi

          if grep -q "v5.0.1-pwa" dist/sw.js; then
            echo "ERROR: old v5.0.1 service worker detected."
            exit 1
          fi

          echo "v5.1.0 Service Worker verified successfully."

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Vite dist
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

      - name: Save generated package-lock
        uses: actions/upload-artifact@v4
        with:
          name: npm-package-lock-v5.1.0
          path: package-lock.json
          if-no-files-found: warn
          retention-days: 30

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy Vite build to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

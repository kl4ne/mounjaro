name: Build and deploy GLP-1 Companion

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Reject legacy root structure
        shell: bash
        run: |
          set -euo pipefail
          legacy_paths=(assets icons runtime sw.js manifest.webmanifest)
          found=0
          for path in "${legacy_paths[@]}"; do
            if [ -e "$path" ]; then
              echo "::error::Legacy root path detected: $path"
              found=1
            fi
          done
          if [ -e ".github/workflows/deploy-pages.yml" ]; then
            echo "::error::Legacy workflow detected: .github/workflows/deploy-pages.yml"
            found=1
          fi
          if [ "$found" -ne 0 ]; then
            echo "Repository is not clean. Remove the legacy paths before deployment."
            exit 1
          fi
          echo "Clean Vite repository structure verified."

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'

      - name: Show Node and npm versions
        run: |
          node --version
          npm --version

      - name: Verify v5.1.0 source before install
        run: node scripts/verify-source.mjs

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build and validate with Vite
        run: npm run build

      - name: Final v5.1.0 deployment guard
        shell: bash
        run: |
          set -euo pipefail
          test -d dist
          test -f dist/index.html
          test -f dist/sw.js
          test -f dist/manifest.webmanifest
          test -f dist/runtime/09-ai-intelligence.js
          grep -q 'v5.1.0' dist/index.html
          grep -q "v5.1.0-pwa" dist/sw.js
          node -e "const fs=require('fs'); const m=JSON.parse(fs.readFileSync('dist/manifest.webmanifest','utf8')); if(m.version!=='5.1.0') { console.error('Unexpected manifest version:',m.version); process.exit(1); } console.log('Manifest version:',m.version);"
          echo "GLP-1 Companion v5.1.0 production build verified."
          find dist -maxdepth 2 -type f | sort

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Vite dist
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy Vite build to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
